<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop-test</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            max-width: 660px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin: 0 0 12px 0; }
        h2 { font-size: 1.5rem; margin: 0 0 12px 0; }
        p { font-size: 1.05rem; line-height: 1.6; color: #334155; }
        
        .id-pill {
            display: inline-block;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            font-family: monospace;
            font-size: 1.15rem;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 8px;
            margin: 12px 0 20px 0;
        }

        .btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .btn:hover { background-color: #1d4ed8; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: #2563eb;
            width: 100%;
            transition: width 1s linear;
        }

        .timer-text {
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
        }

        .stimulus-box {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        .stimulus-word {
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            user-select: none;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 10px;
        }
        .color-btn {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.08s;
        }
        .color-btn:hover { background: #f8fafc; border-color: #94a3b8; }
        .color-btn:active { transform: scale(0.97); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95rem;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: center;
        }
        th { background-color: #f8fafc; font-weight: 600; }

        .stroop-card {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 16px;
            margin-top: 18px;
            text-align: left;
            font-size: 0.98rem;
            line-height: 1.6;
        }

        .status-msg {
            font-weight: 600;
            margin-top: 12px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. START SCREEN -->
    <div id="screen-start">
        <h1>Stroop-test (6 delar)</h1>
        <p>Testet tar cirka 4–5 minuter totalt och består av 6 korta delar på 30 sekunder vardera. Läs instruktionerna noga inför varje del.</p>
        <div>Ditt unika anonyma deltagar-ID:</div>
        <div class="id-pill" id="start-id-display"></div>
        <br>
        <button class="btn" onclick="goToInstructions()">Starta testet</button>
    </div>

    <!-- 2. INSTRUCTION SCREEN -->
    <div id="screen-instructions" class="hidden">
        <h2 id="inst-header"></h2>
        <p id="inst-body" style="margin: 24px 0;"></p>
        <button class="btn" onclick="startTrialSection()">Jag har läst instruktionerna – Starta</button>
    </div>

    <!-- 3. GAMEPLAY SCREEN -->
    <div id="screen-game" class="hidden">
        <div class="timer-text"><span id="section-label"></span> • Tid kvar: <span id="timer-seconds">30</span>s</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        
        <div class="stimulus-box">
            <div class="stimulus-word" id="stimulus-word">ORD</div>
        </div>

        <div class="grid-buttons">
            <button class="color-btn" onclick="submitAnswer('RÖD')">RÖD</button>
            <button class="color-btn" onclick="submitAnswer('BLÅ')">BLÅ</button>
            <button class="color-btn" onclick="submitAnswer('GRÖN')">GRÖN</button>
            <button class="color-btn" onclick="submitAnswer('GUL')">GUL</button>
        </div>
    </div>

    <!-- 4. END / RESULTS SCREEN -->
    <div id="screen-end" class="hidden">
        <h2>Testet är slutfört!</h2>
        <p>Deltagar-ID: <strong id="end-id-display"></strong></p>
        <div id="db-status" class="status-msg">Sparar dina resultat...</div>

        <table>
            <thead>
                <tr>
                    <th>Del</th>
                    <th>Typ</th>
                    <th>Svarade</th>
                    <th>Rätt</th>
                    <th>Fel</th>
                </tr>
            </thead>
            <tbody id="results-tbody"></tbody>
        </table>

        <div class="stroop-card" id="stroop-results-box"></div>
    </div>
</div>

<script>
    // =========================================================
    // 1. SUPABASE CONFIGURATION (REPLACE THESE TWO VALUES)
    // =========================================================
    const SUPABASE_URL = 'https://zxlkowyznexccizdlegu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Hic-wK02mlcYwJ63ppXk_Q_-HIc03tB';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================
    // 2. EXPERIMENT SETTINGS
    // =========================================================
    const SECONDS_PER_SECTION = 30;

    const COLORS = [
        { name: 'RÖD', hex: '#dc2626' },
        { name: 'BLÅ', hex: '#2563eb' },
        { name: 'GRÖN', hex: '#16a34a' },
        { name: 'GUL', hex: '#eab308' }
    ];

    const SECTIONS = [
        {
            num: 1,
            label: "Konstant färg (Svart)",
            title: "Del 1 av 6",
            instruction: "I den här delen är textfärgen alltid <strong>SVART</strong>, medan orden ändras.<br><br>Klicka på knappen som motsvarar <strong>ORDET</strong> som står skrivet.",
            mode: "constant_color"
        },
        {
            num: 2,
            label: "Konstant ord ('FÄRG')",
            title: "Del 2 av 6",
            instruction: "I den här delen står det alltid ordet <strong>FÄRG</strong>, medan textfärgen ändras.<br><br>Klicka på knappen som motsvarar <strong>TEXTFÄRGEN</strong>.",
            mode: "constant_word"
        },
        {
            num: 3,
            label: "Kongruent 1",
            title: "Del 3 av 6",
            instruction: "Nu stämmer ordet och textfärgen överens (t.ex. ordet RÖD skrivet i röd färg).<br><br>Klicka på knappen som motsvarar <strong>TEXTFÄRGEN</strong>.",
            mode: "congruent"
        },
        {
            num: 4,
            label: "Inkongruent 1",
            title: "Del 4 av 6",
            instruction: "Nu stämmer ordet och textfärgen <strong>INTE</strong> överens (t.ex. ordet RÖD skrivet i blå färg).<br><br>Ignorera vad det står och klicka på <strong>TEXTFÄRGEN</strong>.",
            mode: "incongruent"
        },
        {
            num: 5,
            label: "Kongruent 2",
            title: "Del 5 av 6",
            instruction: "Precis som i del 3 stämmer ordet och textfärgen nu överens igen.<br><br>Klicka på knappen som motsvarar <strong>TEXTFÄRGEN</strong>.",
            mode: "congruent"
        },
        {
            num: 6,
            label: "Inkongruent 2",
            title: "Del 6 av 6",
            instruction: "Sista delen! Precis som i del 4 stämmer ordet och textfärgen <strong>INTE</strong> överens.<br><br>Ignorera ordet och klicka på <strong>TEXTFÄRGEN</strong>.",
            mode: "incongruent"
        }
    ];

    // =========================================================
    // 3. UNIQUE ANONYMOUS PARTICIPANT ID
    // =========================================================
    function getOrCreateParticipantId() {
        let pid = sessionStorage.getItem('stroop_pid');
        if (!pid) {
            const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const randStr = Math.random().toString(36).substring(2, 7).toUpperCase();
            pid = `P-${dateStr}-${randStr}`;
            sessionStorage.setItem('stroop_pid', pid);
        }
        return pid;
    }

    const participantId = getOrCreateParticipantId();
    document.getElementById('start-id-display').innerText = participantId;

    // =========================================================
    // 4. GAME ENGINE
    // =========================================================
let currentIdx = 0;
    let targetAnswer = "";
    let lastStimulusSignature = "";
    let timerId = null;
    let secondsRemaining = SECONDS_PER_SECTION;
    let isRunning = false;
    let scores = {};

    function switchScreen(screenId) {
        ['screen-start', 'screen-instructions', 'screen-game', 'screen-end'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(screenId).classList.remove('hidden');
    }

    function goToInstructions() {
        const sec = SECTIONS[currentIdx];
        document.getElementById('inst-header').innerText = sec.title;
        document.getElementById('inst-body').innerHTML = sec.instruction;
        switchScreen('screen-instructions');
    }

    function startTrialSection() {
        const sec = SECTIONS[currentIdx];
        scores[`s${sec.num}`] = { answered: 0, correct: 0, incorrect: 0 };
        lastStimulusSignature = "";

        secondsRemaining = SECONDS_PER_SECTION;
        isRunning = true;

        document.getElementById('section-label').innerText = sec.title;
        document.getElementById('timer-seconds').innerText = secondsRemaining;
        document.getElementById('progress-fill').style.width = '100%';

        switchScreen('screen-game');
        nextStimulus();

        timerId = setInterval(() => {
            secondsRemaining--;
            document.getElementById('timer-seconds').innerText = secondsRemaining;
            const pct = (secondsRemaining / SECONDS_PER_SECTION) * 100;
            document.getElementById('progress-fill').style.width = `${pct}%`;

            if (secondsRemaining <= 0) {
                finishTrialSection();
            }
        }, 1000);
    }

    function nextStimulus() {
        const sec = SECTIONS[currentIdx];
        const wordEl = document.getElementById('stimulus-word');
        let wordText = "";
        let fontHex = "";
        let answer = "";
        let signature = "";

        do {
            const cObj = COLORS[Math.floor(Math.random() * COLORS.length)];

            if (sec.mode === "constant_color") {
                wordText = cObj.name;
                fontHex = "#0f172a";
                answer = cObj.name;
            } else if (sec.mode === "constant_word") {
                wordText = "FÄRG";
                fontHex = cObj.hex;
                answer = cObj.name;
            } else if (sec.mode === "congruent") {
                wordText = cObj.name;
                fontHex = cObj.hex;
                answer = cObj.name;
            } else if (sec.mode === "incongruent") {
                const others = COLORS.filter(c => c.name !== cObj.name);
                const wObj = others[Math.floor(Math.random() * others.length)];
                wordText = wObj.name;
                fontHex = cObj.hex;
                answer = cObj.name;
            }
            signature = `${wordText}_${fontHex}`;
        } while (signature === lastStimulusSignature);

        lastStimulusSignature = signature;
        targetAnswer = answer;
        wordEl.innerText = wordText;
        wordEl.style.color = fontHex;
    }

    function submitAnswer(chosenColor) {
        if (!isRunning) return;

        const secNum = SECTIONS[currentIdx].num;
        scores[`s${secNum}`].answered++;

        if (chosenColor === targetAnswer) {
            scores[`s${secNum}`].correct++;
        } else {
            scores[`s${secNum}`].incorrect++;
        }

        nextStimulus();
    }

    function finishTrialSection() {
        isRunning = false;
        clearInterval(timerId);
        currentIdx++;

        if (currentIdx < SECTIONS.length) {
            goToInstructions();
        } else {
            completeExperiment();
        }
    }

    async function completeExperiment() {
        switchScreen('screen-end');
        document.getElementById('end-id-display').innerText = participantId;

        const stroop3v4 = scores.s3.correct - scores.s4.correct;
        const stroop5v6 = scores.s5.correct - scores.s6.correct;

        const tbody = document.getElementById('results-tbody');
        tbody.innerHTML = "";
        SECTIONS.forEach(sec => {
            const s = scores[`s${sec.num}`];
            tbody.innerHTML += `
                <tr>
                    <td><strong>Del ${sec.num}</strong></td>
                    <td>${sec.label}</td>
                    <td>${s.answered}</td>
                    <td style="color:#16a34a; font-weight:bold;">${s.correct}</td>
                    <td style="color:#dc2626;">${s.incorrect}</td>
                </tr>
            `;
        });

        document.getElementById('stroop-results-box').innerHTML = `
            <strong>Stroop-effekt (Kongruent rätt − Inkongruent rätt):</strong><br>
            • <strong>Omgång 1 (Del 3 vs Del 4):</strong> ${stroop3v4} poäng (${scores.s3.correct} − ${scores.s4.correct})<br>
            • <strong>Omgång 2 (Del 5 vs Del 6):</strong> ${stroop5v6} poäng (${scores.s5.correct} − ${scores.s6.correct})
        `;

        const record = {
            participant_id: participantId,
            s1_answered: scores.s1.answered, s1_correct: scores.s1.correct, s1_incorrect: scores.s1.incorrect,
            s2_answered: scores.s2.answered, s2_correct: scores.s2.correct, s2_incorrect: scores.s2.incorrect,
            s3_answered: scores.s3.answered, s3_correct: scores.s3.correct, s3_incorrect: scores.s3.incorrect,
            s4_answered: scores.s4.answered, s4_correct: scores.s4.correct, s4_incorrect: scores.s4.incorrect,
            s5_answered: scores.s5.answered, s5_correct: scores.s5.correct, s5_incorrect: scores.s5.incorrect,
            s6_answered: scores.s6.answered, s6_correct: scores.s6.correct, s6_incorrect: scores.s6.incorrect,
            stroop_effect_3_vs_4: stroop3v4,
            stroop_effect_5_vs_6: stroop5v6
        };

        const { error } = await db.from('stroop_experiment').insert([record]);
        const statusEl = document.getElementById('db-status');

        if (error) {
            console.error("Supabase error:", error);
            statusEl.innerText = "Kunde inte spara till databasen. Ta en skärmdump av dina resultat nedan!";
            statusEl.style.color = "#dc2626";
        } else {
            statusEl.innerText = "✓ Dina resultat har sparats i databasen!";
            statusEl.style.color = "#16a34a";
        }
    }
</script>
</body>
</html>
